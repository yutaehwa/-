<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSnap PDF</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      background: #f8fafc;
      color: #1e293b;
    }
    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-size: 16px; font-weight: 700; color: #1e293b; }
    .logo span { color: #2563eb; }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
    }
    main { padding: 16px; }
    .url-box {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .url-label { font-size: 10px; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
    .url-text { font-size: 12px; color: #475569; word-break: break-all; line-height: 1.4; max-height: 48px; overflow: hidden; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .option-group label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
    select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 12px;
      color: #475569;
      background: white;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: #3b82f6; }
    .api-key-section { margin-bottom: 12px; }
    .api-key-section label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
    input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 11px;
      font-family: monospace;
      color: #475569;
      outline: none;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    .btn-convert {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-convert:hover:not(:disabled) { background: #1d4ed8; }
    .btn-convert:disabled { background: #93c5fd; cursor: not-allowed; }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
    }
    .status.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .status.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    footer {
      padding: 10px 16px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 10px;
      color: #94a3b8;
    }
    footer a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <div class="logo">WebSnap <span>PDF</span></div>
    <span class="badge">Extension</span>
  </header>

  <main>
    <div class="url-box">
      <div class="url-label">현재 페이지</div>
      <div class="url-text" id="current-url">불러오는 중...</div>
    </div>

    <div class="options">
      <div class="option-group">
        <label>용지 크기</label>
        <select id="format">
          <option value="A4">A4</option>
          <option value="Letter">Letter</option>
        </select>
      </div>
      <div class="option-group">
        <label>방향</label>
        <select id="orientation">
          <option value="portrait">세로</option>
          <option value="landscape">가로</option>
        </select>
      </div>
    </div>

    <div class="api-key-section">
      <label>API 키 (대시보드에서 발급)</label>
      <input type="text" id="api-key" placeholder="wsp_..." />
    </div>

    <button class="btn-convert" id="convert-btn">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      PDF로 저장
    </button>

    <div class="status" id="status"></div>
  </main>

  <footer>
    <a href="https://your-domain.com/dashboard" target="_blank">대시보드에서 API 키 발급</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
